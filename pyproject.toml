[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docconv"
version = "1.0.0"
description = "智能化 PDF 转 Markdown 文档器"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hunter Zheng" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "click>=8.1",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
bot = [
    "httpx>=0.27.0",
]
integrations = [
    "python-telegram-bot>=21.0",
    "lark-oapi>=1.4.0",
]

[project.scripts]
docconv = "docconv.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
